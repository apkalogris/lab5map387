<!DOCTYPE html>
<html>
    <head>
        <title>Lab 5</title>

        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

        <!-- Billboard.js (bundled with D3) -->
        <link href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>

        <!-- GeoJSON Data File -->
        <script type="text/javascript" src="data.js"></script>

        <style type="text/css">
            #map { height: 500px; }
            #chart { margin-top: 15px; }

            .legend {
                padding: 6px 8px;
                line-height: 18px;
                background: rgba(255,255,255,0.9);
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                border-radius: 5px;
            }
            .legend i {
                width: 18px;
                height: 18px;
                float: left;
                margin-right: 8px;
                opacity: 0.7;
            }
        </style>
    </head>

    <body>
        <div id="map"></div>
        <div id="chart"></div>
        
        <script type="text/javascript">
            var map = L.map('map', {
              center: [41.81, -87.71],
              zoom: 10
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
               maxZoom: 11,
               minZoom: 5
            }).addTo(map);

            function getColor(value) {
                return value > 12500 ? '#54278f':
                       value > 8000  ? '#756bb1':
                       value > 6000  ? '#9e9ac8':
                       value > 2000  ? '#cbc9e2':
                                     '#f2f0f7';
            }

            function style(feature) {
                return {
                    fillColor: getColor(feature.properties.popdem),
                    weight: 2,
                    opacity: 1,
                    color: 'gray',
                    fillOpacity: 0.9
                };
            }

            function makeChart(props) {
                bb.generate({   
                    bindto: '#chart',
                    size: {
                        height: 200,
                        width: 250        
                    },
                    title: {
                        text: 'Tract ' + (props.GEOID || '')
                    },
                    data: {
                        columns: [  
                            ['White', props.White],
                            ['Black', props.Black],
                            ['Hispanic', props.Hispanic],
                            ['Asian', props.Asian],
                            ['Multi-racial', props.Multiracia],
                            ['Other', props.Other]
                        ],
                        type: 'donut'
                    },
                    donut: {
                        label: { show: false },
                        width: 30
                    },
                    color: {
                        pattern: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#CC79A7"]
                    }
                });
            }
            
            function highlightFeature(e) {
                var layer = e.target;
                
                makeChart(layer.feature.properties);

                layer.setStyle({
                    weight: 5,
                    color: '#666',
                    dashArray: '6',
                    fillOpacity: 0.7
                });

                if (!L.Browser.ie && !L.Browser.opera) {
                    layer.bringToFront();
                }         
            }
        
            var geojson;
            
            function resetHighlight(e) {
                geojson.resetStyle(e.target);
            }

            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                });
            }
                       
            geojson = L.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);
            
            var legend = L.control({position: 'bottomright'});

            legend.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'legend'),
                    grades = [0, 2000, 6000, 8000, 12500];

                div.innerHTML = '<b>Population Density <br> 2020 <br></b>';

                for (var i = 0; i < grades.length; i++) {
                    div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
                }

                return div;
            };

            legend.addTo(map);
        </script>
   </body>
</html>
